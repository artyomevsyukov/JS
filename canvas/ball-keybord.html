<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball</title>
    <style>
        body {
            height: 90vh;
            background-color: rgb(107, 98, 98);
            display: grid;
            place-items: center;
        }
    </style>
</head>

<body>
    <canvas class="canvas" id="canvas"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        // canvas.width = 400;
        // canvas.height = 400;

        class Ball {
            constructor(width = 400, height = 400, radius = 5) {
                this.canvas = document.getElementById("canvas");
                this.ctx = this.canvas.getContext("2d");
                this.colors = ["Red", "Orange", "Yellow", "Green", "Blue", "Purple"];

                this.width = width;
                this.height = height;
                this.x = this.width / 2;
                this.y = this.height / 2;

                this.xSpeed = 5;
                this.ySpeed = 0;
                this.speed = 5



                this.color = this.randomColor(this.colors);
                this.radius = radius;
                this.setCanvasSize();
            }


            rednder() {
                this.draw();
                this.move();
                this.checkCollision();
            }

            randomSpeed() {
                return Math.random() * 10 - 5
            }

            randomColor(collorsArr) {
                return collorsArr[Math.floor(Math.random() * collorsArr.length)]
            }

            changeColor(collorsArr) {
                this.color = collorsArr[Math.floor(Math.random() * collorsArr.length)]
            }

            setCanvasSize() {
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.canvas.style.width = this.width + 'px';
                this.canvas.style.height = this.height + 'px';
            }

            circle(x, y, radius, fillCircle) {
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2, false);
                this.ctx.fillStyle = this.color;
                if (fillCircle) {
                    this.ctx.fill();
                } else {
                    this.ctx.stroke();
                }
            }

            draw() {
                this.circle(this.x, this.y, this.radius, true);
            }

            move() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;
            }



            // с другой стороны
            // checkCollision() {
            //     if (this.x < 0) {
            //         this.x = this.width;
            //         // this.xSpeed = -this.xSpeed;
            //         this.changColor(this.colors)
            //     }
            //     if (this.x > this.width) {
            //         this.x = 0;
            //         // this.xSpeed = -this.xSpeed;
            //         this.changColor(this.colors)
            //     }
            //     ///
            //     if (this.y < 0) {
            //         this.y = this.height;
            //         // this.ySpeed = -this.ySpeed;
            //         this.changColor(this.colors)
            //     }
            //     if (this.y > this.height) {
            //         this.y = 0;
            //         // this.ySpeed = -this.ySpeed;
            //         this.changColor(this.colors)
            //     }
            // }

            checkCollision() {
                if (this.x < 0 + this.radius || this.x > this.width - this.radius) {
                    this.xSpeed = -this.xSpeed;
                    this.changeColor(this.colors)
                }
                if (this.y < 0 + this.radius || this.y > this.height - this.radius) {
                    this.ySpeed = -this.ySpeed;
                    this.changeColor(this.colors)
                }
            }
            setDirection(event) {
                if (event.code === 'KeyW') {
                    this.xSpeed = 0;
                    this.ySpeed = this.speed * -1;
                }
                if (event.code === 'KeyS') {
                    this.xSpeed = 0;
                    this.ySpeed = this.speed * 1;
                }
                if (event.code === 'KeyA') {
                    this.xSpeed = this.speed * -1;
                    this.ySpeed = 0;
                }
                if (event.code === 'KeyD') {
                    this.xSpeed = this.speed * 1;
                    this.ySpeed = 0;
                }
                if (event.code === 'Space') {
                    this.xSpeed = 0;
                    this.ySpeed = 0;
                }
            }

            changeSpeed(event) {
                const speedMultipliers = {
                    Digit1: 1,
                    Digit2: 1.2,
                    Digit3: 1.4,
                    Digit4: 1.6,
                    Digit5: 1.8,
                    Digit6: 2,
                    Digit7: 2.2,
                    Digit8: 2.4,
                    Digit9: 2.6,
                    Digit0: 3,
                };
                if (event.code === "ArrowUp") {
                    this.speed += 1;
                } else if (event.code === "ArrowDown") {
                    this.speed = Math.max(1, this.speed - 1);
                } else {
                    const multiplier = speedMultipliers[event.code];
                    if (multiplier) {
                        this.speed = 5 * multiplier;
                    }
                }

                if (this.xSpeed > 0) {
                    this.xSpeed = this.speed;
                } else if (this.xSpeed < 0) {
                    this.xSpeed = -this.speed;
                }

                if (this.ySpeed > 0) {
                    this.ySpeed = this.speed;
                } else if (this.ySpeed < 0) {
                    this.ySpeed = -this.speed;
                }

                console.log("Updated speed:", this.speed, "xSpeed:", this.xSpeed, "ySpeed:", this.ySpeed);
            }

            changeSize(event) {
                if (event.code === "ArrowLeft") {
                    this.radius = Math.max(1, this.radius - 1);
                }
                if (event.code === "ArrowRight") {
                    this.radius += 1;
                }

                console.log("Updated size:", this.radius);
            }
        }

        const ball = new Ball()

        setInterval(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ball.rednder()

            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }, 15)


        document.body.addEventListener("keydown", (event) => {
            ball.changeSpeed(event)
            ball.setDirection(event)
            ball.changeSize(event)
        })
    </script>

</body>

</html>
