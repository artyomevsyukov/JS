<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball</title>
    <style>
        body {
            height: 90vh;
            background-color: rgb(107, 98, 98);
            display: grid;
            place-items: center;
        }
    </style>
</head>

<body>
    <canvas class="canvas" id="canvas"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        // canvas.width = 400;
        // canvas.height = 400;

        class Ball {
            constructor(width = 400, height = 400, radius = 5) {
                this.canvas = document.getElementById("canvas");
                this.ctx = this.canvas.getContext("2d");
                this.colors = ["Red", "Orange", "Yellow", "Green", "Blue", "Purple"];

                this.width = width;
                this.height = height;
                // this.x = this.width / 2;
                // this.y = this.height / 2;
                this.x = Math.random() * width; // Случайное начальное положение
                this.y = Math.random() * height;

                this.xSpeed = this.randomSpeed();
                this.ySpeed = this.randomSpeed();

                this.color = this.randomColor(this.colors);
                this.radius = radius;
                this.setCanvasSize();
            }


            rednder() {
                this.draw();
                this.move();
                this.checkCollision();
            }

            randomSpeed() {
                return Math.random() * 10 - 5
            }

            randomColor(collorsArr) {
                return collorsArr[Math.floor(Math.random() * collorsArr.length)]
            }

            chengColor(collorsArr) {
                this.color = collorsArr[Math.floor(Math.random() * collorsArr.length)]
            }

            setCanvasSize() {
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.canvas.style.width = this.width + 'px';
                this.canvas.style.height = this.height + 'px';
            }

            circle(x, y, radius, fillCircle) {
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2, false);
                this.ctx.fillStyle = this.color;
                if (fillCircle) {
                    this.ctx.fill();
                } else {
                    this.ctx.stroke();
                }
            }

            draw() {
                this.circle(this.x, this.y, this.radius, true);
            }

            move() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

            }

            checkCollision() {
                if (this.x < 0 || this.x > this.width) {
                    this.xSpeed = -this.xSpeed;
                    this.chengColor(this.colors)
                }
                if (this.y < 0 || this.y > this.height) {
                    this.ySpeed = -this.ySpeed;
                    this.chengColor(this.colors)
                }
            }

            // Проверка столкновения с другим мячом
            checkCollisionWithBall(otherBall) {
                const dx = this.x - otherBall.x;
                const dy = this.y - otherBall.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance <= this.radius + otherBall.radius) {
                    // Меняем направление
                    this.xSpeed = -this.xSpeed;
                    this.ySpeed = -this.ySpeed;

                    otherBall.xSpeed = -otherBall.xSpeed;
                    otherBall.ySpeed = -otherBall.ySpeed;

                    // Меняем цвет
                    this.chengColor(this.colors);
                    otherBall.chengColor(otherBall.colors);
                }
            }

        }

        // const balls = Array.from({ length: 10 }, () => new Ball(400, 400));

        const balls = []
        for (let i = 0; i < 10; i++) {
            balls.push(new Ball())
        }

        setInterval(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            balls.forEach(ball => ball.rednder());

            // Проверка столкновений между всеми мячами
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    balls[i].checkCollisionWithBall(balls[j]);
                }
            }


            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }, 15)
    </script>

</body>

</html>
